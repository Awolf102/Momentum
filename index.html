<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Momentum" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Momentum — build a daily habit, one day at a time."
    />
    <meta name="theme-color" content="#05070f" />
    <title>Momentum</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var theme = localStorage.getItem('momentum.theme')
        if (theme === null) {
          // First visit since storage moved to IndexedDB: read the old copy.
          var saved = JSON.parse(localStorage.getItem('momentum.appearance'))
          theme = saved && saved.data && saved.data.theme
        }
        if (theme === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
